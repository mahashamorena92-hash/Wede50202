<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved - Fred and Martie Soupkitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Fred and Martie Soupkitchen</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Our Programs</a></li>
                <li><a href="enquiry.html">Get Involved</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Get Involved</h2>
        <!-- NPO requirement: Volunteer or Sponsor option -->
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="type">I would like to:</label>
            <select id="type" name="type">
                <option value="volunteer">Volunteer</option>
                <option value="sponsor">Become a Sponsor</option>
                <option value="donate">Make a Donation</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Fred and Martie Soupkitchen</p>
    </footer>
</body>
</html>
